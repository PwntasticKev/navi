name: Navi
options:
  bundleIdPrefix: com.donovanhiland
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Local builds only. Releases set the version and build number from the tag and the
    # commit count (scripts/release-plan.sh).
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "3"
    # Sparkle's public EdDSA key. Navi installs only updates signed with its private half.
    # The CI release dry run swaps in a throwaway key on the command line.
    SPARKLE_PUBLIC_KEY: X+a0pYYK9iXdbzkPar690FFC21oqmzJn+f3Ne40NtOE=
packages:
  NaviCore:
    path: Packages/NaviCore
  NaviClipboard:
    path: Packages/NaviClipboard
  NaviCapture:
    path: Packages/NaviCapture
  NaviRecording:
    path: Packages/NaviRecording
  NaviDictation:
    path: Packages/NaviDictation
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
targets:
  Navi:
    type: application
    platform: macOS
    sources: [App/Sources, App/Assets.xcassets]
    dependencies:
      - package: NaviCore
      - package: NaviClipboard
      - package: NaviCapture
      - package: NaviRecording
      - package: NaviDictation
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/donovanhiland/navi/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Navi uses the microphone for talk to type, and for your voice in screen recordings.
        NSSpeechRecognitionUsageDescription: Navi turns your speech into text on this Mac.
        NSCameraUsageDescription: Navi shows your camera in a bubble while you record.
    entitlements:
      path: App/Navi.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donovanhiland.navi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 77SAW76597
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Test builds are a separate app, "Navi Dev", so macOS keeps their permissions apart
        # from the installed Navi (different signature) and Settings never shows two "Navi".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.donovanhiland.navi.dev
          PRODUCT_NAME: Navi Dev
        # Releases are signed with Developer ID. Set here, on the app target only: a command-line
        # identity would also apply to package resource bundles, which Xcode then rejects.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
