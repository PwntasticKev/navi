# Publishes a Navi release. It runs every night at 3:00 Mountain (10:00 UTC) and releases the
# next patch version to everyone when main has new commits; with no new commits it stops on the
# Linux plan job, before a Mac starts or a key is loaded. Start one by hand with
# scripts/release.sh or from the Actions tab. "rehearse" runs every step with the real keys and
# Apple notarization but publishes nothing: use it to check the secrets.
# The steps are in scripts/release-plan.sh and scripts/ci-release.sh. Actions are pinned to full
# commit SHAs because the release job holds the signing keys.
name: Release

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: New version, like 0.3.0. Empty for the next patch version
        required: false
      notes:
        description: What changed. Empty for the commit subjects since the last release
        required: false
      rehearse:
        description: Run every step with the real keys, but publish nothing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.plan.outputs.due }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      notes: ${{ steps.plan.outputs.notes }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: plan
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          scripts/release-plan.sh "$VERSION" "$NOTES"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.due == 'true' || inputs.rehearse
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the plan job saw, so a merge during the run is not released by accident.
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0

      - name: Install tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Add the signing keys
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          # Keep the existing keychains in the search list; the paths have no spaces.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "No Developer ID Application identity in DEVELOPER_ID_P12"; exit 1; }
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Release
        env:
          MODE: ${{ inputs.rehearse && 'rehearse' || 'publish' }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
          NOTES: ${{ needs.plan.outputs.notes }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" scripts/ci-release.sh

      - name: Remove the signing keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
